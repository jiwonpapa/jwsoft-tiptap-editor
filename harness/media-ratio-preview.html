<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>JWSoft MP4 비율 확인</title>
        <style>
            body {
                margin: 0;
                background: #f7f8fa;
                color: #20242b;
                font:
                    14px/1.5 system-ui,
                    sans-serif;
            }
            main {
                max-width: 1040px;
                margin: 40px auto;
                padding: 0 20px;
            }
            h1 {
                margin: 0 0 24px;
                font-size: 22px;
            }
            section + section {
                margin-top: 40px;
            }
            h2 {
                margin: 0 0 12px;
                font-size: 16px;
            }
            .preview-surface {
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                background: #fff;
                padding: 16px;
            }
            @media (max-width: 640px) {
                main {
                    margin: 20px auto;
                    padding: 0 12px;
                }
                .preview-surface {
                    padding: 8px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>세로 MP4 반응형 확인</h1>
            <section aria-labelledby="editor-title">
                <h2 id="editor-title">에디터 화면</h2>
                <div class="preview-surface" id="editor"></div>
            </section>
            <section aria-labelledby="content-title">
                <h2 id="content-title">글보기 화면</h2>
                <div
                    class="jwsoft-tiptap-content preview-surface"
                    id="content"
                ></div>
            </section>
        </main>
        <script type="module">
            import { createEditor } from "../resources/js/editor/createEditor.ts";
            import { injectEditorStyles } from "../resources/js/editor/editorStyles.ts";
            import { enhanceContentMedia } from "../resources/js/editor/mediaRenderer.ts";

            injectEditorStyles();
            const source =
                "/tests/fixtures/playable-portrait.mp4?ratio-preview=1";
            const canonical = `<figure class="jw-media jw-media-16x9 jw-media-mp4"><a class="jw-media-source" href="${source}" rel="noopener noreferrer" target="_blank">portrait.mp4</a></figure>`;
            const editor = createEditor({
                element: document.querySelector("#editor"),
                content: canonical,
                editable: true,
                placeholder: "",
                onUpdate: () => {},
            });
            document.querySelector("#content").innerHTML = canonical;
            enhanceContentMedia({ root: document.querySelector("#content") });
            window.addEventListener("pagehide", () => editor.destroy());
        </script>
    </body>
</html>
