[project]
name = "jw-editor-harness"
version = "1.0.0"
requires-python = ">=3.12"
description = "Repository-local verification and release governance; never a plugin runtime dependency"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["harness/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "S", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"harness/tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["harness/jw_harness", "harness/tests"]
explicit_package_bases = true
warn_unreachable = true
