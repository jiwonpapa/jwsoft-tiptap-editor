name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: make check
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-build
          path: dist/
