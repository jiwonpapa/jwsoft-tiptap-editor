name: Release gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, g7-integration]
    env:
      G7_ROOT: ${{ vars.G7_INTEGRATION_ROOT }}
      G7_BASE_URL: ${{ vars.G7_INTEGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      # A public tag is required before G7 can exercise the GitHub update path.
      # Deployment-bound requirements are therefore promoted locally in order:
      # GitHub lifecycle 60 -> staging 61 -> production/final 62.
      - name: Tagged artifact gate (57 current requirements)
        run: make release-candidate-check
      - name: Publish candidate tagged release
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .build/*.zip .build/SHA256SUMS
          --verify-tag
          --title "${GITHUB_REF_NAME} (development validation)"
          --notes "G7 7.0.9 후보 검증용 릴리스입니다. 최종 62/62 검증이나 운영 배포 완료를 의미하지 않습니다. 운영 적용은 별도 사전 게이트와 명시적 승인이 필요합니다."
      - name: Publish stable tagged release
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .build/*.zip .build/SHA256SUMS --verify-tag --generate-notes
