name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, g7-integration]
    env:
      G7_ROOT: ${{ vars.G7_INTEGRATION_ROOT }}
      G7_BASE_URL: ${{ vars.G7_INTEGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r harness/requirements-dev.txt
      - run: command -v shellcheck
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      # Read-only validation. Explicit Python publication owns ADR-0017 promotion.
      - name: Tagged artifact gate (57 current requirements)
        run: make release-candidate-check
